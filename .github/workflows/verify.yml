name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: diagnostics/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
  dashboard-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/test/js/*.test.cjs
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/crash-probe/*/*.json
            target/crash-probe/*/*.txt
            target/crash-probe/*/*.log
            target/crash-probe/*/*.mv.db
